name: Release

# Pushing a tag vX.Y.Z publishes a GitHub release with the bundles the Proxmox LXC
# script installs (see proxmox/). The tag must match the version in
# backend/pyproject.toml and frontend/package.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Check version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          backend=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml | head -1)
          frontend=$(jq -r .version frontend/package.json)
          echo "tag=$tag backend=$backend frontend=$frontend"
          [[ "$tag" == "$backend" && "$tag" == "$frontend" ]]
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build bundle
        env:
          KURU_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: scripts/build-release.sh "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md >notes.md
          [[ -s notes.md ]] || echo "Release $GITHUB_REF_NAME" >notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.tar.gz >SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
